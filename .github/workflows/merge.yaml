name: Merge PR example
###
on:
  push:
    branches:
      - main
      - practice
    paths:
      - typescript-project/**
  workflow_dispatch:

jobs:
  pull_request:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: typescript-project

    steps:
      - name: Checkout repo
        uses: actions/checkout@v2

      - name: Setup Nodejs
        uses: actions/setup-node@v2
        with:
          node-version: "16.x"
          #cache: 'npm'
          #cache-dependency-path: typescript-project/yarn.lock

      #Install yarn
      - name: Install yarn
        run: npm install --global yarn

      # Install dependencies
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Run linting
      - name: Run linting
        run: yarn lint

      # compile code
      - name: Build project
        run: yarn build

      # Run tests
      - name: Run tests
        run: yarn test

      - run: git config user.email "me@example.com"
      - run: git config user.name "My Name"
      - run: yarn version --patch --message "Bump version to %s"

      - run: git push
      - run: git push --follow-tags