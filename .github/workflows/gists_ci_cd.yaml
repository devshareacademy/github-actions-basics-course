name: 'Github Gists API'
on:
  workflow_dispatch:
  push:

defaults:
  run:
    shell: bash
    working-directory: ./solution

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v2

      - name: "Install Python"
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: "Install Python dependencies"
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: "Run unit tests"
        run: pytest .

      - name: "Build docker image"
        run: docker build -t gists-api-server .

      - name: "Deploy docker image"
        run: docker run -d -p 8080:8080 gists-api-server

      - name: "Sanity test Webserver"
        run: 'curl "http://localhost:8080/octocat?page=2&per_page=5"'



